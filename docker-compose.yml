version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sincronizamei_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sincronizamei_dev
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d sincronizamei_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: sincronizamei_redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devredis}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sincronizamei_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # HTTP management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devrabbit}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
